# 每周抓取热门 AI 工具 → 写入草稿区 data/tools-draft.ts
# 半自动模式：只抓取不 commit，人工在 /admin/tools 后台审核后手动入库
# 每周日 UTC 19:00 运行（北京时间周一 03:00）

name: Weekly Trending Draft

on:
  # 每周日 UTC 19:00（北京周一 03:00）
  schedule:
    - cron: '0 19 * * 0'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write  # 需要写草稿文件
  issues: write    # 失败时创建 Issue 通知

jobs:
  fetch-trending:
    name: Fetch Trending AI Tools
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiaomaai.net/package-lock.json

      - name: Install dependencies
        working-directory: xiaomaai.net
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Fetch trending drafts
        id: fetch
        working-directory: xiaomaai.net
        run: node scripts/fetch-trending.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- xiaomaai.net/data/tools-draft.ts)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 检测到新草稿（写入 runner，不自动 commit）"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ 无新增草稿"
          fi

      # 半自动模式: 抓取结果仅存为 artifact,不 commit / 不 push
      - name: Upload drafts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-draft
          path: xiaomaai.net/data/tools-draft.ts
          retention-days: 30

      - name: Create Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🤖 每周工具抓取失败',
              '',
              `- **Workflow**: ${context.workflow}`,
              `- **Run**: [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **时间**: ${new Date().toUTCString()}`,
              '',
              '请检查 scripts/fetch-trending.mjs、GitHub API 配额或 Product Hunt RSS 是否可用。',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 每周工具抓取失败',
              body,
              labels: ['automation', 'bug'],
            })

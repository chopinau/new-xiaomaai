# 每日抓取 AI 资讯 → 写入草稿区 data/news-draft.ts
# 半自动模式：只抓取不 commit，人工在 /admin/news 审核后手动发布
# 每天 UTC 18:00 运行（北京时间凌晨 02:00）

name: Daily News Draft

on:
  # 每天 UTC 18:00（北京 02:00）
  schedule:
    - cron: '0 18 * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write  # 需要写草稿文件
  issues: write    # 失败时创建 Issue 通知

jobs:
  fetch-news:
    name: Fetch AI News Drafts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xiaomaai.net/package-lock.json

      - name: Install dependencies
        working-directory: xiaomaai.net
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Fetch news drafts
        id: fetch
        working-directory: xiaomaai.net
        run: node scripts/fetch-news.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- xiaomaai.net/data/news-draft.ts)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 检测到新草稿（写入 runner，不自动 commit）"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ 无新增草稿"
          fi

      # 半自动模式: 抓取结果仅存为 artifact,不 commit / 不 push
      # 人工下载草稿文件 → 本地 npm run dev → /admin/news 审核发布
      - name: Upload drafts as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-draft
          path: xiaomaai.net/data/news-draft.ts
          retention-days: 30

      - name: Create Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🤖 每日资讯抓取失败',
              '',
              `- **Workflow**: ${context.workflow}`,
              `- **Run**: [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- **时间**: ${new Date().toUTCString()}`,
              '',
              '请检查 scripts/fetch-news.mjs 或 RSS 源是否可用。',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 每日资讯抓取失败',
              body,
              labels: ['automation', 'bug'],
            })

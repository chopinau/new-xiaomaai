<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image2 提示词库 | 小马AI</title>
    <meta name="description" content="精选 200+ 条 GPT Image 2 提示词，分类筛选、一键复制、搜索">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050505;
            --fg: #ffffff;
            --neon-orange: #F97316;
            --neon-pink: #EC4899;
            --neon-cyan: #06B6D4;
        }
        html, body { background: var(--bg); color: var(--fg); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 10%, rgba(249,115,22,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(236,72,153,0.08) 0%, transparent 40%);
            pointer-events: none; z-index: 0;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 32px 16px; position: relative; z-index: 1; }

        /* Header */
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: rgba(255,255,255,0.7); text-decoration: none;
            padding: 8px 16px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s; font-size: 0.9rem;
        }
        .back-link:hover { background: rgba(249,115,22,0.2); color: #fff; }

        .title-block { text-align: center; flex: 1; }
        .title-main {
            font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 900;
            background: linear-gradient(90deg, #F97316, #EC4899, #06B6D4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .title-sub { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-top: 4px; }

        /* Category Filter */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
            padding: 16px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
        }
        .cat-btn {
            padding: 6px 16px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6); cursor: pointer; transition: all 0.2s;
        }
        .cat-btn:hover { background: rgba(249,115,22,0.2); color: #fff; }
        .cat-btn.active { background: linear-gradient(135deg, #F97316, #EC4899); border-color: transparent; color: #fff; }

        /* Search */
        .search-bar { margin-bottom: 24px; }
        .search-input {
            width: 100%; max-width: 500px; padding: 12px 16px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; outline: none;
        }
        .search-input:focus { border-color: rgba(249,115,22,0.5); }
        .search-input::placeholder { color: rgba(255,255,255,0.3); }

        /* Grid */
        .prompt-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px; margin-bottom: 32px;
        }
        .prompt-card {
            position: relative; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s;
        }
        .prompt-card:hover { transform: translateY(-3px); border-color: rgba(249,115,22,0.4); box-shadow: 0 8px 25px rgba(249,115,22,0.15); }

        /* Card preview - real image (with gradient fallback) */
        .card-preview {
            aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; position: relative; overflow: hidden;
            background: #0a0a0a;
        }
        .card-preview img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }
        .prompt-card:hover .card-preview img { transform: scale(1.06); }
        .card-preview-fallback {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--g1, #F97316), var(--g2, #EC4899));
            opacity: 0.35;
        }
        .card-preview-fallback::after {
            content: ''; position: absolute; inset: 0;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(0,0,0,0.2) 0%, transparent 50%);
        }
        .card-preview-fallback span { position: relative; z-index: 1; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }

        /* Category-specific gradients */
        .grad-人物肖像 { --g1: #EC4899; --g2: #7E22CE; }
        .grad-产品电商 { --g1: #F97316; --g2: #EAB308; }
        .grad-场景景观 { --g1: #06B6D4; --g2: #22C55E; }
        .grad-UI-App设计 { --g1: #8B5CF6; --g2: #06B6D4; }
        .grad-动漫漫画 { --g1: #EC4899; --g2: #F97316; }
        .grad-插画艺术 { --g1: #7E22CE; --g2: #EC4899; }
        .grad-3D渲染 { --g1: #22C55E; --g2: #06B6D4; }
        .grad-食物饮品 { --g1: #EAB308; --g2: #F97316; }
        .grad-海报传单 { --g1: #7E22CE; --g2: #06B6D4; }
        .grad-其他 { --g1: #6B7280; --g2: #1F2937; }

        .card-body { padding: 14px; }
        /* 无图卡片：让标题更显眼，padding 调整 */
        .prompt-card.no-image .card-body { padding: 18px 16px; }
        .prompt-card.no-image .card-title { font-size: 1.05rem; -webkit-line-clamp: 3; }
        .card-title { font-size: 0.95rem; font-weight: 600; color: #fff; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
        .card-tag {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
            background: rgba(249,115,22,0.15); color: #F97316;
        }
        .copy-btn {
            width: 100%; padding: 8px 0;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: rgba(255,255,255,0.7);
            font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(249,115,22,0.2); color: #fff; }
        .copy-btn.copied { background: rgba(34,197,94,0.2); color: #22C55E; border-color: rgba(34,197,94,0.3); }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 24px; }
        .page-btn {
            min-width: 36px; height: 36px; padding: 0 10px;
            border-radius: 8px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
            cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .page-btn:hover:not(:disabled) { background: rgba(249,115,22,0.2); color: #fff; }
        .page-btn.active { background: linear-gradient(135deg, #F97316, #EC4899); border-color: transparent; color: #fff; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Detail Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: rgba(10,10,10,0.98); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px; max-width: 720px; width: 100%; max-height: 85vh;
            overflow-y: auto; padding: 28px;
        }
        .modal-image {
            width: 100%; max-height: 360px; overflow: hidden; border-radius: 10px;
            margin-bottom: 16px; background: #0a0a0a;
        }
        .modal-image img { width: 100%; height: 100%; max-height: 360px; object-fit: contain; display: block; }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 12px; }
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 700; color: #fff; flex: 1; }
        .modal-close {
            background: none; border: 1px solid rgba(255,255,255,0.2); color: #fff;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .modal-text {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 16px; color: rgba(255,255,255,0.85);
            font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
            font-family: 'Courier New', monospace; margin-bottom: 16px; max-height: 400px; overflow-y: auto;
        }
        .modal-copy {
            width: 100%; padding: 12px 0;
            background: linear-gradient(135deg, #F97316, #EC4899);
            border: none; border-radius: 8px; color: #fff;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .modal-copy:hover { opacity: 0.9; transform: scale(1.01); }
        .modal-copy.copied { background: linear-gradient(135deg, #22C55E, #16A34A); }
        .modal-footer { margin-top: 14px; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.4); }
        .modal-footer a { color: #06B6D4; text-decoration: underline; }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #F97316, #EC4899); color: #fff;
            padding: 12px 28px; border-radius: 24px; font-size: 0.9rem; font-weight: 600;
            z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* Empty state */
        .empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4); font-size: 1rem; }

        /* Responsive */
        @media (max-width: 640px) {
            .prompt-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .card-preview { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
        <a href="/index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>
        <div class="title-block">
            <div class="title-main">Image2 提示词库</div>
            <div class="title-sub">精选 282 条 GPT Image 2 提示词 · 一键复制 · 带图预览</div>
        </div>
        <div style="width: 90px"></div>
    </div>

    <!-- Category Filter -->
    <div class="filter-bar" id="categoryFilter">
        <!-- JS 渲染 -->
    </div>

    <!-- Search -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索提示词、分类、风格..." class="search-input">
    </div>

    <!-- Grid -->
    <div class="prompt-grid" id="promptGrid"></div>
    <div id="emptyState" class="empty" style="display:none">没有匹配的提示词</div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
</div>

<!-- Modal placeholder -->
<div id="modalContainer"></div>
<!-- Toast placeholder -->
<div id="toastContainer"></div>

<script src="/prompts/prompt-data.js"></script>
<script>
(function() {
    const ITEMS_PER_PAGE = 24;
    const CATEGORY_ICONS = {
        '人物肖像': '👤', '产品电商': '📦', '场景景观': '🏞️',
        'UI/App设计': '📱', '动漫漫画': '🎭', '插画艺术': '🎨',
        '3D渲染': '💎', '食物饮品': '🍜', '海报传单': '📋', '其他': '✨'
    };

    let currentCategory = '全部';
    let currentSearch = '';
    let currentPage = 1;

    function renderCategoryButtons() {
        const container = document.getElementById('categoryFilter');
        container.innerHTML = PROMPT_CATEGORIES.map(cat => {
            const active = cat === currentCategory ? ' active' : '';
            return `<button class="cat-btn${active}" data-cat="${cat}">${cat}</button>`;
        }).join('');
        container.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.dataset.cat;
                currentPage = 1;
                renderCategoryButtons();
                renderGrid();
            });
        });
    }

    function getFiltered() {
        let list = PROMPT_LIBRARY;
        if (currentCategory !== '全部') {
            list = list.filter(p => p.category === currentCategory);
        }
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            list = list.filter(p =>
                p.title.toLowerCase().includes(q) ||
                p.prompt.toLowerCase().includes(q) ||
                p.category.toLowerCase().includes(q) ||
                p.style.toLowerCase().includes(q)
            );
        }
        return list;
    }

    function renderGrid() {
        const list = getFiltered();
        const grid = document.getElementById('promptGrid');
        const empty = document.getElementById('emptyState');

        if (list.length === 0) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        empty.style.display = 'none';

        const totalPages = Math.ceil(list.length / ITEMS_PER_PAGE);
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const pageItems = list.slice(start, start + ITEMS_PER_PAGE);

        grid.innerHTML = pageItems.map(p => {
            const icon = CATEGORY_ICONS[p.category] || '📝';
            const gradClass = 'grad-' + p.category;
            const encodedPrompt = encodeURIComponent(p.prompt);
            // 有图：显示图片预览方框；无图：完全省略方框，只留文字
            const previewBlock = p.imageUrl
                ? `<div class="card-preview ${gradClass}"><img src="${p.imageUrl}" alt="${p.title.replace(/"/g, '&quot;')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.remove();" /></div>`
                : '';
            return `
            <div class="prompt-card ${p.imageUrl ? 'has-image' : 'no-image'}" data-id="${p.id}">
                ${previewBlock}
                <div class="card-body">
                    <div class="card-title">${p.title}</div>
                    <div class="card-tags">
                        <span class="card-tag">${p.category}</span>
                        <span class="card-tag">${p.style}</span>
                    </div>
                    <button class="copy-btn" data-prompt="${encodedPrompt}">📋 复制提示词</button>
                </div>
            </div>`;
        }).join('');

        // Bind card clicks -> modal
        grid.querySelectorAll('.prompt-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('copy-btn')) return;
                const id = parseInt(card.dataset.id);
                const p = PROMPT_LIBRARY.find(x => x.id === id);
                if (p) showModal(p);
            });
        });

        // Bind copy buttons
        grid.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const text = decodeURIComponent(btn.dataset.prompt);
                copyToClipboard(text);
                btn.textContent = '✅ 已复制';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = '📋 复制提示词'; btn.classList.remove('copied'); }, 2000);
            });
        });

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button class="page-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
        const max = 5;
        let start = Math.max(1, currentPage - Math.floor(max / 2));
        let end = Math.min(totalPages, start + max - 1);
        start = Math.max(1, end - max + 1);
        for (let i = start; i <= end; i++) {
            const active = i === currentPage ? ' active' : '';
            html += `<button class="page-btn${active}" data-page="${i}">${i}</button>`;
        }
        html += `<button class="page-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
        container.innerHTML = html;
        container.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const page = parseInt(btn.dataset.page);
                if (page >= 1 && page <= totalPages) {
                    currentPage = page;
                    renderGrid();
                    window.scrollTo({ top: 200, behavior: 'smooth' });
                }
            });
        });
    }

    function showModal(p) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        const imgBlock = p.imageUrl
            ? `<div class="modal-image"><img src="${p.imageUrl}" alt="${p.title.replace(/"/g, '&quot;')}" referrerpolicy="no-referrer" loading="lazy" /></div>`
            : '';
        overlay.innerHTML = `
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">${p.title}</div>
                    <button class="modal-close">✕</button>
                </div>
                ${imgBlock}
                <div class="modal-meta">
                    <span class="card-tag">${p.category}</span>
                    <span class="card-tag">${p.style}</span>
                    <span class="card-tag" style="background:rgba(6,182,212,0.15);color:#06B6D4">${p.source}</span>
                </div>
                <div class="modal-text">${p.prompt}</div>
                <button class="modal-copy" id="modalCopyBtn">📋 复制提示词</button>
                <div class="modal-footer">
                    来源: <a href="${p.sourceUrl}" target="_blank" rel="noopener">${p.source}</a> · 作者: ${p.author}
                </div>
            </div>`;
        document.getElementById('modalContainer').appendChild(overlay);

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay || e.target.classList.contains('modal-close')) {
                overlay.remove();
            }
        });
        overlay.querySelector('#modalCopyBtn').addEventListener('click', () => {
            copyToClipboard(p.prompt);
            const btn = overlay.querySelector('#modalCopyBtn');
            btn.textContent = '✅ 已复制到剪贴板';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '📋 复制提示词'; btn.classList.remove('copied'); }, 2000);
        });
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(showToast);
        } else {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast();
        }
    }

    function showToast() {
        let toast = document.getElementById('toastBox');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toastBox';
            toast.className = 'toast';
            document.getElementById('toastContainer').appendChild(toast);
        }
        toast.textContent = '✅ 提示词已复制到剪贴板';
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Search (debounced)
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentSearch = e.target.value.trim();
            currentPage = 1;
            renderGrid();
        }, 300);
    });

    // Init
    renderCategoryButtons();
    renderGrid();
})();
</script>
</body>
</html>
